name: Argus
options:
  bundleIdPrefix: com.beholdmeme
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Argus:
    type: application
    platform: iOS
    sources:
      - path: Argus
        excludes:
          - "www"
      - path: Argus/www
        type: folder
        buildPhase: resources
    info:
      path: Argus/Info.plist
      properties:
        CFBundleDisplayName: Argus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Argus listens to nearby Bluetooth devices to find trackers, drones and other radios. It never connects to them."
        NSLocationWhenInUseUsageDescription: "Argus uses your location for the map, trails, tracker following and drone distance. Nothing leaves your phone."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beholdmeme.argus
