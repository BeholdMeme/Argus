name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Copy the web app into the iPhone app
        run: |
          rm -rf ios/Argus/www
          mkdir -p ios/Argus/www
          cp -R index.html manifest.webmanifest css js data vendor icons ios/Argus/www/
          rm -f ios/Argus/www/data/build_data.py

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set +e
          xcodebuild -project Argus.xcodeproj -scheme Argus -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            grep -E "error:|fatal" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done
            tail -n 80 build.log
            exit 1
          fi
          test -d build/Build/Products/Release-iphoneos/Argus.app

      - name: Package Argus.ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Argus.app Payload/
          zip -qry Argus.ipa Payload
          ls -la Argus.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Argus-ipa
          path: ios/Argus.ipa

      - name: Publish to the "app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "Argus iPhone app" --notes "Install Argus.ipa with SideStore. Updated automatically on every change."
          gh release upload app ios/Argus.ipa --clobber
